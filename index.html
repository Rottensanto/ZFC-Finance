<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ZFC Finance Office – Teamwirtschaft, Sponsoren und Ligaverwaltung"><title>ZFC • Finance Office</title>
<style>
:root{--bg:#0b1019;--panel:#121b29;--line:#253248;--muted:#99aac1;--text:#eff5ff;--blue:#427bff;--mint:#6aebbc;--red:#ff8495}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button,.button{border:1px solid var(--line);background:#1b293d;color:white;border-radius:8px;padding:10px 15px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button:hover{background:#2a405d}button.primary,.primary{background:var(--blue);border-color:var(--blue)}button.danger{color:var(--red)}button:disabled{opacity:.4;cursor:not-allowed}a{color:#a8c4ff}header{height:76px;padding:0 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:30px;background:#0b1019;position:sticky;top:0;z-index:3}.brand{font-size:25px;font-weight:900;letter-spacing:-1px;color:white;text-decoration:none}.brand em{color:var(--mint);font-style:normal}header nav{display:flex;gap:22px;align-items:center;flex:1}header nav a{color:var(--muted);text-decoration:none}header nav a.active{color:white}header small{color:var(--muted)}.shell{max-width:1500px;margin:auto;padding:32px 4% 70px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:700;color:var(--mint);text-transform:uppercase}h1{font-size:34px;line-height:1.15;margin:12px 0}h2{font-size:20px;margin:0 0 12px}h3{margin:8px 0}p{color:var(--muted)}.hero{padding:65px 0 50px;display:grid;grid-template-columns:1.3fr 1fr;gap:65px;align-items:center}.hero h1{font-size:clamp(42px,5.5vw,78px);letter-spacing:-3px}.hero p{font-size:17px;max-width:550px}.hero-art{background:linear-gradient(145deg,#233c68,#101c2c);border:1px solid #35517b;border-radius:22px;padding:35px;position:relative;overflow:hidden}.hero-art:before{content:'ZFC';position:absolute;font-size:180px;font-weight:950;transform:rotate(-16deg);opacity:.05;top:0;left:-15px}.hero-art>*{position:relative}.bigmoney{font-size:45px;font-weight:800;letter-spacing:-2px}.track{height:80px;border:13px solid #77a4ff;border-left-color:var(--mint);border-radius:55% 25% 45% 20%;transform:rotate(-12deg);margin:35px 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:23px;min-width:0}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:27px;letter-spacing:-1px;margin:7px 0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:22px}.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:9px 14px;border-radius:7px}.tabs a.active{background:#20365a;color:white}.notice{border:1px solid #38517a;background:#142238;color:#b9cbea;padding:12px 16px;border-radius:8px;margin:15px 0;font-size:13px}.success{color:var(--mint)}.bad{color:var(--red)}.tag{display:inline-block;border:1px solid var(--line);padding:3px 9px;border-radius:20px;font-size:11px;letter-spacing:.3px;color:#bed0ec}.tag.green{color:var(--mint);border-color:#285749}.tag.red{color:var(--red);border-color:#6b3543}.tablewrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;background:#162131}th,td{padding:15px 17px;border-bottom:1px solid var(--line)}td small{display:block;color:var(--muted)}td button{padding:5px 9px;font-size:12px}tbody tr:last-child td{border:0}.empty{text-align:center;padding:45px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #34445e;background:#0c1421;color:white;border-radius:7px;padding:11px}input[type=checkbox]{width:auto}label{display:block;color:var(--muted);font-size:12px;margin:13px 0 5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.full{grid-column:1/-1}dialog{background:var(--panel);color:white;border:1px solid #3d5274;border-radius:14px;padding:28px;width:650px;max-width:94vw;max-height:90vh}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}dialog h2{margin:0}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.toast{position:fixed;bottom:25px;right:25px;padding:14px 22px;border-radius:9px;background:#284e44;color:white;z-index:20;box-shadow:0 8px 40px #0008}footer{border-top:1px solid var(--line);padding:25px 5%;color:var(--muted);font-size:12px}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.bar{height:7px;border-radius:4px;background:#293951;margin:10px 0 20px}.bar span{height:100%;background:var(--blue);display:block;border-radius:4px}.money{font-variant-numeric:tabular-nums}.lead{margin-bottom:26px}.printhead{display:none}#search{max-width:280px}.help p{margin:8px 0 20px}.help li{color:var(--muted);margin:10px 0}@media(max-width:900px){.stats,.grid{grid-template-columns:repeat(2,1fr)}.hero,.split{grid-template-columns:1fr}.hero{gap:20px;padding-top:30px}.hero-art{display:none}header{gap:15px;padding:0 4%}header nav{gap:12px}header small{display:none}.shell{padding:22px 4% 50px}}@media(max-width:550px){.stats,.grid,.formgrid{grid-template-columns:1fr}.hero h1{letter-spacing:-2px}header nav a{font-size:12px}h1{font-size:28px}.bigmoney{font-size:33px}.full{grid-column:auto}}@media print{body{background:white;color:#111}header,footer,.tabs,.toolbar,button,.notice,.noprint{display:none!important}.shell{padding:0}.card,.tablewrap{background:white;border-color:#ccc}th,td{color:#111;border-color:#ddd;background:white}p,.muted{color:#555}.printhead{display:block}dialog{position:static;max-height:none;width:100%;border:0;background:white;color:#111}body:has(dialog[open]) main{display:none}dialog .actions{display:none}.tag{color:#111}}
</style></head><body><header><a class="brand" href="#front">ZFC<em> /</em></a><nav><a href="#front">Startseite</a><a href="#home">Finance Office</a><a href="#market">Marktplatz</a></nav><small>ZENITH FORMULA CHAMPIONSHIP</small></header><main id="app" class="shell"></main><footer class="row between"><span>ZFC Finance Office · Virtuelle Ligawährung · Version 1.0</span><span>Lokale Einzeldatei · Datenexport regelmäßig sichern</span></footer><dialog id="modal"></dialog><div id="toast" role="status" hidden class="toast"></div><input id="importFile" type="file" accept="application/json" hidden>
<script>
'use strict';
// ZFC Finance Office. Buildless GitHub Pages frontend. No authentication/backend.
// All monetary amounts are whole virtual euros. Ledger entries are immutable;
// paid invoices are corrected via explicit reversal entries, never deletion.
const KEY='zfc-finance-v1', $=s=>document.querySelector(s), uid=()=>crypto.randomUUID();
const categories=['Sponsoring','Preisgeld','Teilnahmegebühr','Rennveranstaltung','Streckenmiete','Server und Technik','Lizenzen','Marketing','Teamprämien','Reisekosten','Sonstiges','Teamkauf','HQ'];
const HQS=[{id:'athens',city:'Athen',country:'Griechenland',tier:'Basis',price:2000000,upkeep:30000,lat:37.98,lon:23.73},{id:'barcelona',city:'Barcelona',country:'Spanien',tier:'Standard',price:4000000,upkeep:60000,lat:41.39,lon:2.17},{id:'cologne',city:'Köln',country:'Deutschland',tier:'Standard',price:4000000,upkeep:60000,lat:50.94,lon:6.96},{id:'london',city:'London',country:'Großbritannien',tier:'Premium',price:6500000,upkeep:95000,lat:51.51,lon:-.13},{id:'monaco',city:'Monaco',country:'Monaco',tier:'Prestige',price:9000000,upkeep:140000,lat:43.74,lon:7.42}];
const SPONSORS=[{id:'main',name:'Nexora Global',type:'Hauptsponsor',amount:6000000,mode:'split',desc:'3 Mio. zum Vertragsbeginn + 3 Mio. nach Rennen 8.'},{id:'race',name:'Apex Performance',type:'Rennsponsor',amount:220000,mode:'race',desc:'220.000 € je freigegebenem Rennen. Kürzungen manuell prüfen.'},{id:'tech',name:'Vector Systems',type:'Technikpartner',amount:120000,mode:'race',desc:'120.000 € je freigegebenem Rennen.'},{id:'regional',name:'Horizon Partners',type:'Regionalpartner',amount:800000,mode:'once',desc:'800.000 € nach Rennen 4.'}];
const TRACKS=[['Australien','Australien',-37.85,144.97],['Bahrain','Bahrain',26.03,50.51],['Saudi-Arabien','Saudi-Arabien',21.63,39.1],['Miami','USA',25.96,-80.24],['Imola','Italien',44.34,11.72],['Monaco','Monaco',43.74,7.42],['Spanien','Spanien',41.57,2.26],['Österreich','Österreich',47.22,14.76],['Großbritannien','Großbritannien',52.07,-1.02],['Belgien','Belgien',50.44,5.97],['Niederlande','Niederlande',52.39,4.54],['Italien','Italien',45.62,9.28],['Singapur','Singapur',1.29,103.86],['Baku','Aserbaidschan',40.37,49.85],['Mexiko','Mexiko',19.4,-99.09],['Abu Dhabi','VAE',24.47,54.6]];
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Bucharest'});
function plus(date,days){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)}
function initial(){return {version:1,settings:{season:'ZFC Saison 1',start:25000000,fee:8000},teams:[],invoices:[],ledger:[],contracts:[],claims:[],audit:[],rounds:TRACKS.map((t,i)=>({id:uid(),name:t[0],country:t[1],lat:t[2],lon:t[3],date:plus(today(),7*(i+1)),number:i+1,billed:[],released:[]}))}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}
let selected='',query='';
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const team=id=>db.teams.find(t=>t.id===id), hq=t=>HQS.find(h=>h.id===t.hq), balance=id=>db.ledger.filter(l=>l.team===id).reduce((a,l)=>a+l.amount,0);
const total=i=>i.lines.reduce((a,l)=>a+l.amount,0)+i.fee;
const open=id=>db.invoices.filter(i=>i.team===id&&i.status==='open').reduce((a,i)=>a+total(i),0);
const available=id=>balance(id)-open(id);
const receivable=id=>db.claims.filter(c=>c.team===id&&c.status==='pending').reduce((a,c)=>a+c.amount,0);
function audit(action){db.audit.unshift({id:uid(),time:new Date().toISOString(),action});}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function commit(action){audit(action);try{save()}catch(e){alert('Speichern fehlgeschlagen. Bitte sofort JSON exportieren.');}render();toast(action)}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function entry(t,amount,category,note,ref=''){db.ledger.push({id:uid(),team:t,amount,category,note,ref,date:today()})}
function invoice(t,lines,note,due=plus(today(),3)){const i={id:uid(),number:'ZFC-'+String(db.invoices.length+1).padStart(5,'0'),team:t,lines,fee:db.settings.fee,note,date:today(),due,status:'open'};db.invoices.push(i);return i}
function claim(t,amount,note,due,ref){db.claims.push({id:uid(),team:t,amount,note,due,pay:plus(due,7),status:'pending',ref})}
function travel(t,r){const h=hq(t);if(!h)return null;if(h.country===r.country)return 30000;const rad=n=>n*Math.PI/180;const a=Math.sin(rad(r.lat-h.lat)/2)**2+Math.cos(rad(h.lat))*Math.cos(rad(r.lat))*Math.sin(rad(r.lon-h.lon)/2)**2;const km=6371*2*Math.atan2(Math.sqrt(a),Math.sqrt(Math.max(0,1-a)));return km<=1500?50000:km<=3500?90000:km<=7000?140000:200000}
function optionsTeams(){return db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}
const views=[['home','Übersicht'],['teams','Teams & Konten'],['invoices','Rechnungen'],['ledger','Buchungen'],['market','HQ & Sponsoren'],['calendar','Rennkalender'],['claims','Auszahlungen'],['settings','Einstellungen']];
function top(title,sub,actions=''){return `<div class="row between lead"><div><div class="eyebrow">${esc(db.settings.season)} / Finance Office</div><h1>${title}</h1><p>${sub}</p></div><div class="row">${actions}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">Noch keine Einträge vorhanden.</td></tr>`}</tbody></table></div>`}
function stat(label,value,sub=''){return `<div class="card stat"><small>${label}</small><strong class="money">${value}</strong><small>${sub}</small></div>`}
function filterbar(){return `<div class="toolbar"><select id="teamFilter" style="max-width:260px"><option value="">Alle Teams</option>${optionsTeams()}</select><input id="search" placeholder="Suchen …" aria-label="Einträge durchsuchen"></div>`}
function matches(id,text){return (!selected||id===selected)&&String(text).toLowerCase().includes(query.toLowerCase())}
function render(){const page=location.hash.slice(1)||'front';let html='';if(page==='front'){html=`<section class="hero"><div><div class="eyebrow">Zenith Formula Championship</div><h1>Race for glory.<br><span style="color:var(--mint)">Build your legacy.</span></h1><p>Ein Team. Ein Hauptquartier. Deine Entscheidungen. Die wirtschaftliche Heimat der ZFC – von der ersten Übernahme bis zur nächsten Meisterschaft.</p><div class="row"><a class="button primary" href="#home">Finance Office öffnen ↗</a><a class="button" href="#market">Marktplatz entdecken</a></div><p style="font-size:12px">Virtuelle Teamwirtschaft · 16 Rennen · Ein gemeinsames Regelmodell</p></div><div class="hero-art"><span class="tag green">SEASON FINANCE</span><p>Dein Startkapital</p><div class="bigmoney">${eur(db.settings.start)}</div><div class="track"></div><div class="row between"><span>Strategie abseits der Strecke</span><span class="success">ZFC / 01</span></div></div></section><div class="grid"><div class="card"><div class="eyebrow">01 / Ownership</div><h2>Dein Team. Deine Verantwortung.</h2><p>Team kaufen, Präsidenten ernennen und den finanziellen Grundstein legen.</p><a href="#teams">Teams verwalten →</a></div><div class="card"><div class="eyebrow">02 / Partnerships</div><h2>Partner für die nächste Saison.</h2><p>Vier Sponsorplätze mit klaren Verträgen und sieben Tagen Auszahlungsverzug.</p><a href="#market">Sponsoren ansehen →</a></div><div class="card"><div class="eyebrow">03 / Finance</div><h2>Jede Entscheidung zählt.</h2><p>Rechnungen, Zahlungsfreigaben und ein nachvollziehbares Buchungsjournal.</p><a href="#invoices">Zur Rechnungsverwaltung →</a></div></div><div class="notice">Diese Version arbeitet lokal in deinem Browser. Es gibt noch keine Benutzeranmeldung oder gemeinsame Live-Datenbank. Die Beispiel-Sponsoren sind virtuelle Angebote.</div>`}
else{html=`<div class="tabs">${views.map(v=>`<a class="${v[0]===page?'active':''}" href="#${v[0]}">${v[1]}</a>`).join('')}</div>`;const pages={home:dashboard,teams:teamsPage,invoices:invoicesPage,ledger:ledgerPage,market:marketPage,calendar:calendarPage,claims:claimsPage,settings:settingsPage};html+=(pages[page]||dashboard)()}
$('#app').innerHTML=html;document.querySelectorAll('header nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+page));if($('#teamFilter')){$('#teamFilter').value=selected;$('#teamFilter').onchange=e=>{selected=e.target.value;render()};$('#search').value=query;$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}}}
function dashboard(){const cash=db.teams.reduce((a,t)=>a+balance(t.id),0),pending=db.invoices.filter(i=>i.status==='open');return top('Das Finanzcockpit.','Alle Teams, Verpflichtungen und nächsten Schritte an einem Ort.',`<button onclick="download()">↓ JSON sichern</button><button class="primary" onclick="newInvoice()">+ Rechnung</button>`)+`<div class="notice">Lokaler Verwaltungsmodus · Änderungen werden in diesem Browser gespeichert. Für Teamarbeit auf mehreren Geräten ist ein Backend erforderlich.</div><div class="stats">${stat('Teamvermögen gesamt',eur(cash),db.teams.length+' registrierte Teams')}${stat('Offene Rechnungen',eur(pending.reduce((a,i)=>a+total(i),0)),pending.length+' Rechnungen')}${stat('Ausstehende Einnahmen',eur(db.claims.filter(c=>c.status==='pending').reduce((a,c)=>a+c.amount,0)),'Noch nicht verfügbar')}${stat('Liga-Gebühren bezahlt',eur(db.invoices.filter(i=>i.status==='paid').reduce((a,i)=>a+i.fee,0)),'In Teamabbuchungen enthalten')}</div><div class="split"><section><h2>Teamübersicht</h2>${table(['Team / Präsident','Kontostand','Verfügbar'],db.teams.map(t=>`<tr><td><b>${esc(t.name)}</b><small>${esc(t.president)}</small></td><td>${eur(balance(t.id))}</td><td class="${available(t.id)<0?'bad':'success'}">${eur(available(t.id))}</td></tr>`).join(''))}</section><section class="card"><div class="eyebrow">Aktivitätsprotokoll</div><h2>Zuletzt im Office</h2>${db.audit.slice(0,7).map(a=>`<p style="border-bottom:1px solid var(--line);padding-bottom:10px"><small>${esc(new Date(a.time).toLocaleString('de-DE'))}</small><br><span style="color:white">${esc(a.action)}</span></p>`).join('')||'<p>Beginne mit einem neuen Team.</p>'}<a href="#settings">Regeln & Datensicherung →</a></section></div>`}
function teamsPage(){return top('Teams & Konten','Jeder Teamchef wird als Teampräsident erfasst. Das Startkapital wird einmalig gebucht.',`<button class="primary" onclick="newTeam()">+ Team anlegen</button>`)+`<div class="grid">${db.teams.map(t=>`<article class="card"><div class="row between"><span class="tag">TEAM ACCOUNT</span><button onclick="editTeam('${t.id}')">Bearbeiten</button></div><h2 style="margin-top:15px">${esc(t.name)}</h2><p>Präsident: ${esc(t.president)}<br>HQ: ${esc(hq(t)?.city||'Noch nicht gekauft')}<br>Discord: ${esc(t.discord||'—')}</p><div class="bigmoney" style="font-size:30px">${eur(balance(t.id))}</div><p>Offene Rechnungen: ${eur(open(t.id))}<br>Verfügbar: <b class="${available(t.id)<0?'bad':'success'}">${eur(available(t.id))}</b><br>Offene Einnahmen: ${eur(receivable(t.id))}</p><div class="row"><button onclick="setupTeam('${t.id}')" ${t.setup?'disabled':''}>${t.setup?'Grundkosten erstellt':'Grundkosten erstellen'}</button><button onclick="newInvoice('${t.id}')">Rechnung</button></div></article>`).join('')||'<div class="card"><h2>Das erste Team wartet.</h2><p>Lege ein Team an. Es erhält das eingestellte Startkapital.</p><button class="primary" onclick="newTeam()">Team erstellen</button></div>'}</div>`}
function invoicesPage(){return top('Rechnungsverwaltung','Eine Liga-Gebühr pro Rechnung. Zahlungen werden genau einmal ins Journal übernommen.',`<button onclick="window.print()">Drucken</button><button class="primary" onclick="newInvoice()">+ Rechnung erstellen</button>`)+filterbar()+table(['Nummer / Betreff','Team','Fällig','Betrag inkl. Gebühr','Status','Aktion'],db.invoices.filter(i=>matches(i.team,i.number+' '+i.note+' '+team(i.team)?.name)).slice().reverse().map(i=>`<tr><td><b>${esc(i.number)}</b><small>${esc(i.note)}</small></td><td>${esc(team(i.team)?.name)}</td><td>${esc(i.due)}</td><td>${eur(total(i))}</td><td>${status(i.status,i.status==='open'&&i.due<today())}</td><td><button onclick="showInvoice('${i.id}')">Details</button> ${i.status==='open'?`<button onclick="payInvoice('${i.id}')">Bezahlen</button> <button onclick="cancelInvoice('${i.id}')">Storno</button>`:i.status==='paid'?`<button onclick="cancelInvoice('${i.id}')">Rückbuchen</button>`:''}</td></tr>`).join(''))}
function status(s,late=false){return `<span class="tag ${s==='paid'||s==='received'?'green':late?'red':''}">${late?'Überfällig':({open:'Offen',paid:'Bezahlt',cancelled:'Storniert',pending:'Ausstehend',received:'Ausgezahlt'}[s]||s)}</span>`}
function ledgerPage(){return top('Buchungsjournal','Gebuchte Einnahmen und Ausgaben. Korrekturen bleiben als Gegenbuchung sichtbar.',`<button onclick="csv()">↓ CSV</button><button class="primary" onclick="newEntry()">+ Buchung</button>`)+filterbar()+table(['Datum','Team','Kategorie','Beschreibung','Betrag'],db.ledger.filter(l=>matches(l.team,l.note+' '+l.category)).slice().reverse().map(l=>`<tr><td>${l.date}</td><td>${esc(team(l.team)?.name)}</td><td>${esc(l.category)}</td><td>${esc(l.note)}</td><td class="${l.amount>=0?'success':'bad'}">${eur(l.amount)}</td></tr>`).join(''))}
function marketPage(){return top('Der ZFC-Marktplatz','Hauptquartiere erwerben und Sponsorenverträge für dein Team abschließen.')+`<h2>HQ-Standorte</h2><div class="grid">${HQS.map(h=>`<div class="card"><span class="tag">${h.tier}</span><h2 style="margin-top:15px">${h.city}</h2><p>${h.country}<br>Unterhalt: ${eur(h.upkeep)} / Rennen<br>Reisen werden vom Standort berechnet.</p><h3>${eur(h.price)}</h3><button onclick="buyHQ('${h.id}')">HQ kaufen</button></div>`).join('')}</div><h2 style="margin-top:35px">Sponsorenangebote</h2><p>Virtuelle Verträge. Je ein Vertrag pro Kategorie und Team. Keine automatische Garantie für Teilnahmebedingungen.</p><div class="grid">${SPONSORS.map(s=>`<div class="card"><span class="tag green">${s.type}</span><h2 style="margin-top:15px">${s.name}</h2><p>${s.desc}</p><p>Auszahlung immer 7 Tage nach Fälligkeit.</p><button onclick="signSponsor('${s.id}')">Vertrag abschließen</button></div>`).join('')}</div><h2 style="margin-top:35px">Aktive Verträge</h2>${table(['Team','Sponsor','Kategorie','Vertragsbeginn'],db.contracts.map(c=>{const s=SPONSORS.find(s=>s.id===c.sponsor);return `<tr><td>${esc(team(c.team)?.name)}</td><td>${esc(s.name)}</td><td>${s.type}</td><td>${c.date}</td></tr>`}).join(''))}`}
function calendarPage(){return top('Rennkalender','Bearbeitbare Beispieltermine. Rennrechnungen und Sponsoransprüche werden je Team nur einmal erzeugt.')+`<div class="notice">Vor dem Saisonbeginn die Termine bearbeiten. Rennfreigabe erst nach Prüfung der Teilnahme und Sponsorbedingungen ausführen. Rechnungs- und Anspruchsdaten bleiben nach Erstellung unverändert.</div>`+table(['Runde','Veranstaltung','Datum','Rennrechnung','Sponsoransprüche','Kalender'],db.rounds.map(r=>`<tr><td>${String(r.number).padStart(2,'0')}</td><td><b>${esc(r.name)}</b><small>${esc(r.country)}</small></td><td>${r.date}</td><td><button onclick="billRound('${r.id}')">Erstellen (${r.billed.length})</button></td><td><button onclick="releaseRound('${r.id}')">Freigeben (${r.released.length})</button></td><td><button onclick="editRound('${r.id}')">Bearbeiten</button></td></tr>`).join(''))}
function claimsPage(){return top('Sponsorenauszahlungen','Fälligkeit und Auszahlung sind getrennt. Eine Auszahlung ist frühestens nach sieben Tagen möglich.',`<button class="primary" onclick="settleDue()">Fällige Beträge auszahlen</button>`)+filterbar()+table(['Team','Anspruch','Fällig laut Vertrag','Auszahlbar ab','Betrag','Status / Aktion'],db.claims.filter(c=>matches(c.team,c.note)).slice().reverse().map(c=>`<tr><td>${esc(team(c.team)?.name)}</td><td>${esc(c.note)}</td><td>${c.due}</td><td>${c.pay}</td><td>${eur(c.amount)}</td><td>${status(c.status)} ${c.status==='pending'?`<button onclick="editClaim('${c.id}')">Prüfen</button> <button onclick="settle('${c.id}')" ${c.pay>today()?'disabled':''}>Auszahlen</button>`:''}</td></tr>`).join(''))}
function settingsPage(){return top('System & Datensicherung','Einstellungen gelten für neue Vorgänge. Bestehende Rechnungen und Buchungen bleiben unverändert.')+`<div class="split"><section class="card"><h2>Saisoneinstellungen</h2><form onsubmit="settingsSave(event)"><label>Saisonname</label><input name="season" value="${esc(db.settings.season)}" required maxlength="100"><label>Startkapital pro neuem Team (€)</label><input name="start" type="number" min="0" max="1000000000" step="1" value="${db.settings.start}" required><label>Liga-Gebühr je neuer Rechnung (€)</label><input name="fee" type="number" min="0" max="1000000" step="1" value="${db.settings.fee}" required><div class="actions"><button class="primary">Speichern</button></div></form></section><section class="card"><h2>Daten mitnehmen</h2><p>JSON enthält den vollständigen Datenstand. CSV exportiert das Buchungsjournal. Vor einem Import wird ein Sicherungsexport angeboten.</p><div class="row"><button onclick="download()">JSON exportieren</button><button onclick="$('#importFile').click()">JSON importieren</button><button onclick="csv()">Journal als CSV</button></div><p class="bad">Ein Import ersetzt den lokalen Datenstand. Dateien nur aus vertrauenswürdigen Quellen importieren.</p></section></div><section class="card help" style="margin-top:20px"><h2>So arbeitet ihr mit dem System</h2><ol><li>Team anlegen: 25 Mio. € Startkapital werden einmalig als Eröffnung gebucht.</li><li>Grundkosten erstellen: Teamkauf, Lizenzen, Anmeldung, Technik und Marketing – sieben Rechnungen. HQ folgt als achte Rechnung.</li><li>HQ kaufen: Der Standort ist reserviert; Rennbetrieb wird erst nach Zahlung der HQ- und Grundkostenrechnungen freigeschaltet.</li><li>Sponsoren abschließen: Hauptsponsorrate 1 wird geplant; weitere Ansprüche entstehen nach Rennfreigaben.</li><li>Kalender prüfen, Rennrechnungen erzeugen und bezahlen. Die Rechnung enthält HQ-Unterhalt und entfernungsabhängige Reise.</li><li>Sponsoransprüche nach Prüfung freigeben. Kürzungen und Begründungen vor Auszahlung über „Prüfen“ dokumentieren.</li><li>Preisgeld, Saisonprämien und weitere Einnahmen als Buchung erfassen. Teamprämien als Rechnung erstellen.</li><li>JSON regelmäßig exportieren. Änderungen auf anderen Geräten werden in dieser Version nicht synchronisiert.</li></ol><h2>Für die Weiterentwicklung auf GitHub</h2><p>Diese Datei benötigt keine Bibliotheken und läuft auf GitHub Pages. Für gemeinsamen Betrieb: Datenmodell in eine Datenbank übertragen, serverseitige Transaktionen und Rollen (Liga-Admin, Finanzverwaltung, Teampräsident) ergänzen. Eine Frontend-Rollenauswahl ist kein Zugriffsschutz. Keine Passwörter oder API-Schlüssel in diese Datei schreiben.</p><p>Das Journal ist innerhalb der Oberfläche ohne Löschfunktion; Browserdaten und JSON-Dateien sind technisch veränderbar. Diese Version ist deshalb keine revisionssichere Mehrbenutzer-Buchhaltung.</p><h2>Finanzmodell</h2><p>Startkapital 25 Mio. € · Team 12 Mio. € · Teamlizenz 1,2 Mio. € · Fahrer je 200.000 € · Anmeldung 1,6 Mio. € · Technik 480.000 € · Marketing 800.000 €. Pro Rennen: Teilnahme 180.000 €, Veranstaltung 120.000 €, Strecke 160.000 €, Sonstiges 25.000 €, HQ und Reise variabel. Teamprämienbudget 1,2 Mio. € manuell abrechnen. HQs sind pro Team verfügbar, keine exklusiven Grundstücke. Virtuelle Euro; keine echte Zahlungsabwicklung.</p></section>`}
function modal(title,body,onSubmit){$('#modal').innerHTML=`<form id="dialogForm"><div class="row between"><h2>${title}</h2><button type="button" onclick="closeModal()" aria-label="Schließen">×</button></div>${body}<div class="actions"><button type="button" onclick="closeModal()">Abbrechen</button><button class="primary" type="submit">Bestätigen</button></div></form>`;$('#dialogForm').onsubmit=e=>{e.preventDefault();try{onSubmit(new FormData(e.target))}catch(err){alert(err.message)}};$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function needTeams(){if(!db.teams.length){toast('Bitte zuerst ein Team anlegen.');return false}return true}
function field(label,name,type='text',value='',extra=''){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}
function teamField(value=''){return `<label>Team</label><select name="team" required>${optionsTeams()}</select>`}
function newTeam(){modal('Team anlegen',field('Teamname','name','text','','required maxlength="80"')+field('Teamchef / Teampräsident','president','text','','required maxlength="80"')+field('Discord-Kontakt','discord','text','','maxlength="100"')+`<p>Einmaliges Startkapital: ${eur(db.settings.start)}. Teamkauf und HQ werden separat berechnet.</p>`,f=>{const name=f.get('name').trim(),president=f.get('president').trim();if(!name||!president)throw Error('Name und Präsident sind erforderlich.');if(db.teams.some(t=>t.name.toLowerCase()===name.toLowerCase()))throw Error('Teamname existiert bereits.');const id=uid();db.teams.push({id,name,president,discord:f.get('discord').trim(),hq:null,setup:false});entry(id,db.settings.start,'Startkapital','Einmalige Kontoeröffnung');closeModal();commit('Team angelegt: '+name)})}
function editTeam(id){const t=team(id);modal('Teamdaten bearbeiten',field('Teamname','name','text',t.name,'required maxlength="80"')+field('Präsident','president','text',t.president,'required maxlength="80"')+field('Discord','discord','text',t.discord,'maxlength="100"'),f=>{const name=f.get('name').trim(),p=f.get('president').trim();if(!name||!p)throw Error('Pflichtfelder ausfüllen.');if(db.teams.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))throw Error('Name bereits belegt.');Object.assign(t,{name,president:p,discord:f.get('discord').trim()});closeModal();commit('Teamdaten aktualisiert: '+name)})}
function setupTeam(id){const t=team(id);if(t.setup)return;if(!confirm('Sieben Grundkostenrechnungen für '+t.name+' erstellen?'))return;
// Sieben Rechnungen: Team, Teamlizenz, zwei Fahrerlizenzen separat, Anmeldung, Technik, Marketing.
const lines=[['Teamkauf',12000000,'Teamübernahme'],['Lizenzen',1200000,'Teamlizenz'],['Lizenzen',200000,'Fahrerlizenz 1'],['Lizenzen',200000,'Fahrerlizenz 2'],['Teilnahmegebühr',1600000,'Saisonanmeldung'],['Server und Technik',480000,'Saison-Technikpaket'],['Marketing',800000,'Saison-Marketingpaket']];t.setupInvoices=lines.map(([category,amount,note])=>invoice(id,[{category,amount,note}],note).id);t.setup=true;commit('Grundkosten erstellt: '+t.name)}
function newInvoice(id=''){if(!needTeams())return;modal('Rechnung erstellen',teamField()+field('Betreff','note','text','','required maxlength="200"')+`<label>Positionen – je Zeile: Kategorie; Beschreibung; Betrag</label><textarea name="lines" rows="5" required>Sonstiges; Verwaltungsleistung; 100000</textarea><p>Kategorien: ${categories.join(', ')}. Positive ganze Eurobeträge. Liga-Gebühr ${eur(db.settings.fee)} wird einmal ergänzt.</p>`+field('Zahlungsziel','due','date',plus(today(),3),'required'),f=>{const lines=f.get('lines').split('\n').filter(l=>l.trim()).map(l=>{const parts=l.split(';');if(parts.length!==3)throw Error('Format: Kategorie; Beschreibung; Betrag');const [category,note,v]=parts.map(x=>x.trim());const amount=Number(v);if(!categories.includes(category)||!note||!Number.isSafeInteger(amount)||amount<=0||amount>1e9)throw Error('Position oder Betrag ungültig.');return {category,note,amount}});if(!lines.length)throw Error('Mindestens eine Position erforderlich.');invoice(f.get('team'),lines,f.get('note').trim(),f.get('due'));closeModal();commit('Rechnung erstellt')});if(id)$('#dialogForm [name=team]').value=id}
function payInvoice(id){const i=db.invoices.find(i=>i.id===id);if(!i||i.status!=='open')return;if(balance(i.team)<total(i))return alert('Kontostand reicht für diese Zahlung nicht aus.');if(!confirm(i.number+' über '+eur(total(i))+' bezahlen?'))return;i.lines.forEach(l=>entry(i.team,-l.amount,l.category,i.number+': '+l.note,i.id));if(i.fee)entry(i.team,-i.fee,'Liga-Gebühr',i.number+': Rechnungsgebühr',i.id);i.status='paid';i.paid=today();commit('Rechnung bezahlt: '+i.number)}
function cancelInvoice(id){const i=db.invoices.find(i=>i.id===id);if(!i||i.status==='cancelled')return;if(team(i.team)?.hqInvoice===id||(team(i.team)?.setupInvoices||[]).includes(id))return alert('Grundkosten und HQ-Käufe sind an die Startberechtigung gekoppelt und können in Version 1.0 nicht storniert werden. Andere Rechnungen können storniert oder rückgebucht werden.');const reason=prompt('Begründung für Storno / Rückbuchung:');if(!reason?.trim())return;if(i.status==='paid'){const entries=db.ledger.filter(l=>l.ref===id);entries.forEach(l=>entry(i.team,-l.amount,l.category,'Storno '+i.number+': '+reason,'reversal:'+id))}i.status='cancelled';i.reason=reason;commit('Rechnung storniert: '+i.number)}
function showInvoice(id){const i=db.invoices.find(x=>x.id===id);$('#modal').innerHTML=`<div class="row between"><h2>ZFC / ${esc(i.number)}</h2><button onclick="closeModal()">×</button></div><p>Virtuelle Ligarechnung · ${esc(db.settings.season)}</p><h3>${esc(team(i.team)?.name)}</h3><p>${esc(i.note)}<br>Erstellt: ${i.date} · Fällig: ${i.due}<br>Status: ${esc(i.status)}</p>${table(['Position','Betrag'],i.lines.map(l=>`<tr><td>${esc(l.category)}<small>${esc(l.note)}</small></td><td>${eur(l.amount)}</td></tr>`).join('')+`<tr><td>Liga-Gebühr</td><td>${eur(i.fee)}</td></tr><tr><td><b>Gesamt</b></td><td><b>${eur(total(i))}</b></td></tr>`)}<div class="actions"><button onclick="window.print()">Drucken / PDF</button><button onclick="closeModal()">Schließen</button></div>`;$('#modal').showModal()}
function newEntry(){if(!needTeams())return;modal('Manuelle Buchung',teamField()+`<label>Buchungsart</label><select name="direction"><option value="1">Einnahme / Gutschrift</option><option value="-1">Ausgabe / Korrektur (ohne Rechnung)</option></select><label>Kategorie</label><select name="category">${categories.map(c=>`<option>${c}</option>`).join('')}</select>`+field('Betrag (€)','amount','number','','required min="1" max="1000000000" step="1"')+field('Beschreibung / Begründung','note','text','','required maxlength="250"')+`<p>Für reguläre Ausgaben eine Rechnung erstellen. Diese direkte Buchung erhebt keine Liga-Gebühr.</p>`,f=>{const amount=Number(f.get('amount'))*Number(f.get('direction'));if(amount<0&&balance(f.get('team'))+amount<0)throw Error('Kontostand nicht ausreichend.');entry(f.get('team'),amount,f.get('category'),f.get('note').trim());closeModal();commit('Manuelle Buchung erfasst')})}
function buyHQ(hid){if(!needTeams())return;const h=HQS.find(h=>h.id===hid);modal('HQ kaufen: '+h.city,teamField()+`<p>Kaufpreis: ${eur(h.price)} + ${eur(db.settings.fee)} Gebühr.<br>Unterhalt: ${eur(h.upkeep)} pro Rennen. Kein Umzug in Version 1.0.</p>`,f=>{const t=team(f.get('team'));if(t.hq)throw Error('Dieses Team besitzt bereits ein HQ.');if(available(t.id)<h.price+db.settings.fee)throw Error('Verfügbares Budget reicht nicht aus.');const i=invoice(t.id,[{category:'HQ',amount:h.price,note:'HQ '+h.city}],'HQ-Kauf '+h.city);t.hq=h.id;t.hqInvoice=i.id;closeModal();commit('HQ reserviert und Rechnung erstellt: '+t.name)})}
function signSponsor(sid){if(!needTeams())return;const s=SPONSORS.find(s=>s.id===sid);modal('Sponsor: '+s.name,teamField()+field('Vertragsbeginn','date','date',today(),'required')+`<p>${s.desc}<br>Alle Auszahlungen sieben Tage später. Maximal ein Vertrag je Sponsorart pro Team und Saison.</p>`,f=>{const tid=f.get('team'),date=f.get('date');if(db.contracts.some(c=>c.team===tid&&c.sponsor===sid))throw Error('Sponsorplatz bereits belegt.');if(db.rounds.some(r=>r.released.includes(tid)))throw Error('Verträge bitte vor der ersten Rennfreigabe abschließen.');if(date>db.rounds[0].date)throw Error('Vertragsbeginn muss spätestens am ersten Renntermin liegen.');const c={id:uid(),team:tid,sponsor:sid,date};db.contracts.push(c);if(s.mode==='split')claim(tid,3000000,s.name+' · Rate 1',date,c.id+':1');closeModal();commit('Sponsorvertrag abgeschlossen')})}
function editRound(id){const r=db.rounds.find(x=>x.id===id);if(r.billed.length||r.released.length)return alert('Bereits abgerechnete / freigegebene Rennen sind gesperrt.');modal('Rennen bearbeiten',field('Bezeichnung','name','text',r.name,'required maxlength="100"')+field('Land (wie HQ-Land schreiben)','country','text',r.country,'required maxlength="80"')+field('Renndatum','date','date',r.date,'required')+field('Breitengrad','lat','number',r.lat,'required min="-90" max="90" step="0.0001"')+field('Längengrad','lon','number',r.lon,'required min="-180" max="180" step="0.0001"'),f=>{r.name=f.get('name').trim();r.country=f.get('country').trim();r.date=f.get('date');r.lat=Number(f.get('lat'));r.lon=Number(f.get('lon'));closeModal();commit('Renntermin aktualisiert')})}
function ready(t){return t.setup&&t.hq&&(t.setupInvoices||[]).every(id=>db.invoices.find(i=>i.id===id)?.status==='paid')&&db.invoices.find(i=>i.id===t.hqInvoice)?.status==='paid'}
function billRound(id){const r=db.rounds.find(x=>x.id===id),eligible=db.teams.filter(t=>ready(t)&&!r.billed.includes(t.id));if(!eligible.length)return alert('Keine neuen berechtigten Teams. Erst HQ und alle Grundkosten bezahlen.');if(!confirm('Rennrechnung für '+eligible.length+' Teams erstellen?'))return;eligible.forEach(t=>{const h=hq(t);invoice(t.id,[{category:'Teilnahmegebühr',note:r.name,amount:180000},{category:'Rennveranstaltung',note:r.name,amount:120000},{category:'Streckenmiete',note:r.name,amount:160000},{category:'HQ',note:'HQ-Unterhalt '+h.city,amount:h.upkeep},{category:'Reisekosten',note:h.city+' → '+r.name,amount:travel(t,r)},{category:'Sonstiges',note:'Rennbetrieb',amount:25000}],'R'+r.number+' · '+r.name,plus(r.date,-3));r.billed.push(t.id)});commit('Rennrechnungen erstellt: '+r.name)}
function releaseRound(id){const r=db.rounds.find(x=>x.id===id);if(r.date>today())return alert('Rennen kann erst am Renntag oder danach freigegeben werden.');const eligible=db.teams.filter(t=>r.billed.includes(t.id)&&!r.released.includes(t.id));if(!eligible.length)return alert('Keine neuen Teams zur Freigabe. Zuerst Rennrechnung erstellen.');modal('Sponsoransprüche freigeben',`<p>R${r.number} · ${esc(r.name)}. Nur teilnehmende Teams auswählen. Kürzungen anschließend unter Auszahlungen prüfen.</p>${eligible.map(t=>`<label><input type="checkbox" name="teams" value="${t.id}" checked> ${esc(t.name)}</label>`).join('')}`,f=>{const ids=f.getAll('teams');if(!ids.length)throw Error('Mindestens ein Team auswählen.');ids.forEach(tid=>{db.contracts.filter(c=>c.team===tid).forEach(c=>{const s=SPONSORS.find(s=>s.id===c.sponsor);if(s.mode==='race')claim(tid,s.amount,s.name+' · R'+r.number,r.date,c.id+':r'+r.number);if(s.mode==='split'&&r.number===8)claim(tid,3000000,s.name+' · Rate 2',r.date,c.id+':2');if(s.mode==='once'&&r.number===4)claim(tid,s.amount,s.name,r.date,c.id+':once')});r.released.push(tid)});closeModal();commit('Sponsoransprüche freigegeben: '+r.name)})}
function editClaim(id){const c=db.claims.find(c=>c.id===id);if(c.status!=='pending')return;modal('Anspruch prüfen',field('Auszahlungsbetrag (€)','amount','number',c.amount,'required min="0" max="1000000000" step="1"')+field('Begründung / Prüfung','note','text',c.review||'','required maxlength="250"')+`<p>Fälligkeit ${c.due} · Auszahlung ab ${c.pay}. Veränderte Beträge werden im Protokoll dokumentiert.</p>`,f=>{const old=c.amount;c.amount=Number(f.get('amount'));c.review=f.get('note').trim();if(!c.review)throw Error('Begründung erforderlich.');closeModal();commit('Anspruch geprüft: '+eur(old)+' → '+eur(c.amount)+' · '+c.review)})}
function settle(id){const c=db.claims.find(c=>c.id===id);if(!c||c.status!=='pending'||c.pay>today())return;if(!confirm(eur(c.amount)+' an '+team(c.team).name+' auszahlen?'))return;entry(c.team,c.amount,'Sponsoring',c.note,c.id);c.status='received';c.received=today();commit('Sponsorenauszahlung gebucht')}
function settleDue(){const list=db.claims.filter(c=>c.status==='pending'&&c.pay<=today());if(!list.length)return toast('Keine fälligen Auszahlungen.');if(!confirm(list.length+' geprüfte Ansprüche über '+eur(list.reduce((a,c)=>a+c.amount,0))+' auszahlen?'))return;list.forEach(c=>{entry(c.team,c.amount,'Sponsoring',c.note,c.id);c.status='received';c.received=today()});commit('Fällige Sponsorenauszahlungen gebucht')}
function settingsSave(e){e.preventDefault();const f=new FormData(e.target);db.settings={season:f.get('season').trim(),start:Number(f.get('start')),fee:Number(f.get('fee'))};commit('Saisoneinstellungen gespeichert')}
function blobDownload(data,name,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function download(){blobDownload(JSON.stringify(db,null,2),'zfc-finance-'+today()+'.json','application/json')}
function csv(){const safe=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const rows=[['Datum','Team','Kategorie','Beschreibung','Betrag EUR'],...db.ledger.map(l=>[l.date,team(l.team)?.name,l.category,l.note,l.amount])];blobDownload('\uFEFF'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),'zfc-journal-'+today()+'.csv','text/csv;charset=utf-8')}
// Strict backup validator: reject malformed IDs, links, money and derived states.
function validate(d){const fail=()=>{throw Error('Ungültige oder inkonsistente ZFC-Sicherungsdatei.')};if(!d||d.version!==1||!d.settings)fail();const money=n=>Number.isSafeInteger(n)&&Math.abs(n)<=1e12;const str=s=>typeof s==='string'&&s.length<10000;const date=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00Z'));if(!str(d.settings.season)||!money(d.settings.start)||d.settings.start<0||!money(d.settings.fee)||d.settings.fee<0)fail();const arrays=['teams','invoices','ledger','contracts','claims','audit','rounds'];arrays.forEach(k=>{if(!Array.isArray(d[k])||d[k].length>100000)fail();const ids=new Set;d[k].forEach(x=>{if(!x||!str(x.id)||!x.id||ids.has(x.id))fail();ids.add(x.id)})});const tids=new Set(d.teams.map(t=>t.id));d.teams.forEach(t=>{if(!str(t.name)||!str(t.president)||!str(t.discord)||typeof t.setup!=='boolean'||(t.hq!==null&&!HQS.some(h=>h.id===t.hq)))fail();if(t.setup&&(!Array.isArray(t.setupInvoices)||t.setupInvoices.length!==7||t.setupInvoices.some(id=>!d.invoices.some(i=>i.id===id&&i.team===t.id))))fail();if(t.hq&&!d.invoices.some(i=>i.id===t.hqInvoice&&i.team===t.id&&i.status!=='cancelled'))fail()});d.invoices.forEach(i=>{if(!tids.has(i.team)||!str(i.number)||!str(i.note)||!date(i.date)||!date(i.due)||!money(i.fee)||i.fee<0||!['open','paid','cancelled'].includes(i.status)||!Array.isArray(i.lines)||!i.lines.length)fail();i.lines.forEach(l=>{if(!str(l.category)||!str(l.note)||!money(l.amount)||l.amount<=0)fail()})});d.ledger.forEach(l=>{if(!tids.has(l.team)||!money(l.amount)||!date(l.date)||!str(l.category)||!str(l.note)||!str(l.ref))fail()});const slots=new Set;d.contracts.forEach(c=>{const slot=c.team+':'+c.sponsor;if(!tids.has(c.team)||!SPONSORS.some(s=>s.id===c.sponsor)||!date(c.date)||slots.has(slot))fail();slots.add(slot)});d.claims.forEach(c=>{if(!tids.has(c.team)||!money(c.amount)||c.amount<0||!str(c.note)||!str(c.ref)||!date(c.due)||c.pay!==plus(c.due,7)||!['pending','received'].includes(c.status))fail()});d.rounds.forEach(r=>{if(!str(r.name)||!str(r.country)||!date(r.date)||!Number.isInteger(r.number)||r.number<1||!Number.isFinite(r.lat)||Math.abs(r.lat)>90||!Number.isFinite(r.lon)||Math.abs(r.lon)>180)fail();['billed','released'].forEach(k=>{if(!Array.isArray(r[k])||new Set(r[k]).size!==r[k].length||r[k].some(id=>!tids.has(id)))fail()})});d.audit.forEach(a=>{if(!str(a.time)||!str(a.action))fail()});return d}
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>20*1024*1024)throw Error('Datei größer als 20 MB.');const data=validate(JSON.parse(await file.text()));if(!confirm('Lokale Daten durch diese Sicherung ersetzen? Vorher wird die aktuelle Sicherung heruntergeladen.'))return;download();db=data;selected='';query='';commit('Sicherung importiert')}catch(err){alert('Import abgelehnt: '+err.message)}finally{e.target.value=''}};
window.addEventListener('hashchange',()=>{selected='';query='';render()});
window.addEventListener('storage',e=>{if(e.key===KEY){try{const newer=validate(JSON.parse(e.newValue));db=newer;render();toast('Daten aus anderem Tab aktualisiert.')}catch{toast('Externe lokale Änderung konnte nicht geladen werden.')}}});
render();
</script></body></html>
